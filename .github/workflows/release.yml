name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build Release
        run: cargo build --release
        
      - name: Rename executable
        run: Move-Item -Path target\release\sysinfo-app.exe -Destination target\release\SysInfo.exe
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/SysInfo.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
